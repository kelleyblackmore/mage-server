apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: mage-idp-ldap-ui
  name: mage-idp-ldap-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mage-idp-ldap-ui
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: mage-idp-ldap-ui
    spec:
      containers:
        - env:
            - name: PHPLDAPADMIN_LDAP_HOSTS
              value: mage-idp-ldap
          image: osixia/phpldapadmin:latest
          name: mage-idp-ldap-ui
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
      restartPolicy: Always
